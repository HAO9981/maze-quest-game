<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maze Quest Game (p5.js)</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <style>
    body { margin:0; background:#0b1020; display:flex; justify-content:center; align-items:center; height:100vh; }
    canvas { border-radius:16px; box-shadow:0 12px 40px rgba(0,0,0,.35); }
  </style>
</head>
<body>
<script>
let state = "START"; // START, PLAY, WIN, LOSE
let cellSize = 32;
let cols = 19;
let rows = 13;

let maze;        // 0 = path, 1 = wall
let player;
let exitCell;

let keyCell;
let hasKey = false;

let startTimeMs = 0;
let timeLimitSec = 100; // 100 seconds to match score 100->0 nicely (you can change)
let timeLeft = timeLimitSec;

let score = 100;

const KEY_SAFE_DIST = 6; // manhattan distance away from exit (not "near")

function setup() {
  createCanvas(cols * cellSize, rows * cellSize + 70);
  textFont("Arial");
  resetGame();
}

function resetGame() {
  maze = generateMaze(cols, rows);

  // Ensure borders are walls
  for (let x = 0; x < cols; x++) { maze[0][x] = 1; maze[rows-1][x] = 1; }
  for (let y = 0; y < rows; y++) { maze[y][0] = 1; maze[y][cols-1] = 1; }

  // Player start (open cell near top-left)
  const startCell = findOpenNear(1, 1);
  player = {
    r: cellSize * 0.33,
    x: (startCell.x + 0.5) * cellSize,
    y: (startCell.y + 0.5) * cellSize,
    speed: 3.0
  };

  // Exit (open cell near bottom-right)
  exitCell = findOpenNear(cols - 2, rows - 2);

  // Key (random open cell far from exit)
  keyCell = spawnKeyCellFarFromExit();

  hasKey = false;
  score = 100;

  timeLeft = timeLimitSec;
  startTimeMs = millis();
  state = "START";
}

function draw() {
  background(10, 16, 32);

  drawMaze();
  drawExit();
  drawKey();
  drawPlayer();
  drawUI();

  if (state === "START") drawStartScreen();
  if (state === "WIN") drawFinishScreen(true);
  if (state === "LOSE") drawFinishScreen(false);

  if (state === "PLAY") {
    updateTimerAndScore();
    handleMovement();
    checkPickKey();
    checkWinLose();
  }
}

function drawUI() {
  noStroke();
  fill(255, 255, 255, 10);
  rect(0, rows * cellSize, width, 70);

  fill(240);
  textSize(16);
  textAlign(LEFT, CENTER);

  const uiY = rows * cellSize + 35;
  text(`Time: ${nf(max(0, floor(timeLeft)), 2)}s`, 14, uiY);
  text(`Score: ${score}`, 140, uiY);

  textAlign(LEFT, CENTER);
  text(hasKey ? "Key: ✅" : "Key: ❌", 260, uiY);

  textAlign(RIGHT, CENTER);
  text(`R: Restart`, width - 14, uiY);
}

function drawMaze() {
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (maze[y][x] === 1) {
        fill(40, 55, 95);
        stroke(255, 255, 255, 20);
        rect(x * cellSize, y * cellSize, cellSize, cellSize, 6);
      } else {
        noStroke();
        fill(255, 255, 255, 6);
        rect(x * cellSize, y * cellSize, cellSize, cellSize);
      }
    }
  }
}

function drawExit() {
  const ex = exitCell.x * cellSize;
  const ey = exitCell.y * cellSize;

  noStroke();

  if (hasKey) {
    fill(80, 255, 170, 90);
    rect(ex + 4, ey + 4, cellSize - 8, cellSize - 8, 10);
    fill(80, 255, 170);
    textSize(12);
    textAlign(CENTER, CENTER);
    text("EXIT", ex + cellSize/2, ey + cellSize/2);
  } else {
    // locked exit
    fill(255, 120, 120, 80);
    rect(ex + 4, ey + 4, cellSize - 8, cellSize - 8, 10);

    fill(255, 120, 120);
    textSize(12);
    textAlign(CENTER, CENTER);
    text("LOCK", ex + cellSize/2, ey + cellSize/2);

    // small lock icon
    stroke(255, 120, 120);
    noFill();
    rect(ex + cellSize*0.32, ey + cellSize*0.42, cellSize*0.36, cellSize*0.30, 4);
    arc(ex + cellSize*0.50, ey + cellSize*0.42, cellSize*0.26, cellSize*0.22, PI, TWO_PI);
  }
}

function drawKey() {
  if (hasKey) return;

  const kx = keyCell.x * cellSize + cellSize/2;
  const ky = keyCell.y * cellSize + cellSize/2;

  // simple "key" drawing
  noStroke();
  fill(255, 215, 90);
  circle(kx - 6, ky, 12);
  rect(kx - 2, ky - 3, 18, 6, 3);
  rect(kx + 10, ky - 3, 4, 10, 2);
  rect(kx + 16, ky - 3, 4, 6, 2);

  fill(255, 215, 90, 60);
  circle(kx, ky, 24);
}

function drawPlayer() {
  noStroke();
  fill(255, 215, 90);
  circle(player.x, player.y, player.r * 2);
  fill(30);
  circle(player.x + player.r * 0.35, player.y - player.r * 0.15, player.r * 0.35);
}

function drawStartScreen() {
  noStroke();
  fill(0, 0, 0, 160);
  rect(0, 0, width, height);

  fill(255);
  textAlign(CENTER, CENTER);
  textSize(28);
  text("MAZE QUEST", width/2, height/2 - 70);

  textSize(14);
  text("Goal: Get the key, then reach the EXIT.", width/2, height/2 - 30);
  text("Score starts at 100 and drops 1 per second.", width/2, height/2 - 10);
  text("Arrow Keys / WASD to move. Walls block you.", width/2, height/2 + 10);
  text("Press SPACE to start.", width/2, height/2 + 40);
}

function drawFinishScreen(isWin) {
  noStroke();
  fill(0, 0, 0, 170);
  rect(0, 0, width, height);

  textAlign(CENTER, CENTER);
  textSize(26);
  fill(255);
  text(isWin ? "YOU ESCAPED ✅" : "TIME UP ⏳", width/2, height/2 - 60);

  textSize(14);
  text(`Final Score: ${score}`, width/2, height/2 - 18);

  textSize(13);
  text("Press R to restart.", width/2, height/2 + 35);
}

function keyPressed() {
  if (key === 'r' || key === 'R') {
    resetGame();
    return;
  }
  if (state === "START" && keyCode === 32) { // SPACE
    state = "PLAY";
    startTimeMs = millis();
  }
}

function updateTimerAndScore() {
  const elapsedSec = (millis() - startTimeMs) / 1000.0;
  timeLeft = timeLimitSec - elapsedSec;

  // score: start 100, minus 1 per second
  score = max(0, 100 - floor(elapsedSec));

  if (timeLeft <= 0 || score <= 0) {
    timeLeft = 0;
    score = 0;
    state = "LOSE";
  }
}

function handleMovement() {
  let dx = 0, dy = 0;
  const sp = player.speed;

  if (keyIsDown(LEFT_ARROW) || keyIsDown(65)) dx -= sp;
  if (keyIsDown(RIGHT_ARROW) || keyIsDown(68)) dx += sp;
  if (keyIsDown(UP_ARROW) || keyIsDown(87)) dy -= sp;
  if (keyIsDown(DOWN_ARROW) || keyIsDown(83)) dy += sp;

  if (dx !== 0 || dy !== 0) {
    const mag = Math.hypot(dx, dy);
    if (mag > sp) {
      dx = dx / mag * sp;
      dy = dy / mag * sp;
    }
    tryMove(dx, dy);
  }
}

function tryMove(dx, dy) {
  const newX = player.x + dx;
  const newY = player.y + dy;

  if (!collidesWithWall(newX, player.y, player.r)) player.x = newX;
  if (!collidesWithWall(player.x, newY, player.r)) player.y = newY;
}

function collidesWithWall(cx, cy, r) {
  const minX = floor((cx - r) / cellSize);
  const maxX = floor((cx + r) / cellSize);
  const minY = floor((cy - r) / cellSize);
  const maxY = floor((cy + r) / cellSize);

  for (let y = minY; y <= maxY; y++) {
    for (let x = minX; x <= maxX; x++) {
      if (x < 0 || y < 0 || x >= cols || y >= rows) return true;
      if (maze[y][x] === 1) {
        const rx = x * cellSize;
        const ry = y * cellSize;
        const closestX = constrain(cx, rx, rx + cellSize);
        const closestY = constrain(cy, ry, ry + cellSize);
        const distSq = (cx - closestX) ** 2 + (cy - closestY) ** 2;
        if (distSq < r * r) return true;
      }
    }
  }
  return false;
}

function checkPickKey() {
  if (hasKey) return;

  const px = floor(player.x / cellSize);
  const py = floor(player.y / cellSize);

  if (px === keyCell.x && py === keyCell.y) {
    hasKey = true;
  }
}

function checkWinLose() {
  if (state !== "PLAY") return;

  const px = floor(player.x / cellSize);
  const py = floor(player.y / cellSize);

  // Must have key AND be on exit tile
  if (hasKey && px === exitCell.x && py === exitCell.y) {
    state = "WIN";
  }
}

/* ===== Key spawn: far from exit ===== */
function spawnKeyCellFarFromExit() {
  // collect all open cells that satisfy distance rule
  let candidates = [];
  for (let y = 1; y < rows - 1; y++) {
    for (let x = 1; x < cols - 1; x++) {
      if (maze[y][x] === 0) {
        const d = manhattan(x, y, exitCell.x, exitCell.y);
        // also avoid spawning on exit itself
        if (d >= KEY_SAFE_DIST && !(x === exitCell.x && y === exitCell.y)) {
          candidates.push({x, y});
        }
      }
    }
  }

  // if maze is tiny or unlucky, relax rule gradually
  let dist = KEY_SAFE_DIST;
  while (candidates.length === 0 && dist > 2) {
    dist--;
    for (let y = 1; y < rows - 1; y++) {
      for (let x = 1; x < cols - 1; x++) {
        if (maze[y][x] === 0) {
          const d = manhattan(x, y, exitCell.x, exitCell.y);
          if (d >= dist && !(x === exitCell.x && y === exitCell.y)) {
            candidates.push({x, y});
          }
        }
      }
    }
  }

  // final fallback: any open cell not on exit
  if (candidates.length === 0) {
    for (let y = 1; y < rows - 1; y++) {
      for (let x = 1; x < cols - 1; x++) {
        if (maze[y][x] === 0 && !(x === exitCell.x && y === exitCell.y)) {
          candidates.push({x, y});
        }
      }
    }
  }

  return random(candidates);
}

function manhattan(x1, y1, x2, y2) {
  return abs(x1 - x2) + abs(y1 - y2);
}

/* ===== Maze generation (DFS carve) ===== */
function generateMaze(w, h) {
  let grid = Array.from({length: h}, () => Array.from({length: w}, () => 1));

  function neighbors(cx, cy) {
    const dirs = [
      {dx: 2, dy: 0},
      {dx: -2, dy: 0},
      {dx: 0, dy: 2},
      {dx: 0, dy: -2},
    ];
    let list = [];
    for (const d of dirs) {
      const nx = cx + d.dx, ny = cy + d.dy;
      if (nx > 0 && ny > 0 && nx < w - 1 && ny < h - 1) {
        list.push({nx, ny, wx: cx + d.dx/2, wy: cy + d.dy/2});
      }
    }
    for (let i = list.length - 1; i > 0; i--) {
      const j = floor(random(i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
    return list;
  }

  let stack = [];
  let sx = 1, sy = 1;
  grid[sy][sx] = 0;
  stack.push({x:sx, y:sy});

  while (stack.length > 0) {
    const cur = stack[stack.length - 1];
    const opts = neighbors(cur.x, cur.y).filter(n => grid[n.ny][n.nx] === 1);

    if (opts.length === 0) {
      stack.pop();
    } else {
      const pick = opts[0];
      grid[pick.wy][pick.wx] = 0;
      grid[pick.ny][pick.nx] = 0;
      stack.push({x: pick.nx, y: pick.ny});
    }
  }

  // punch a few extra holes (makes it less corridor-ish)
  for (let k = 0; k < 18; k++) {
    const x = floor(random(1, w-1));
    const y = floor(random(1, h-1));
    if (grid[y][x] === 1 && countOpenNeighbors(grid, x, y) >= 2) {
      grid[y][x] = 0;
    }
  }

  return grid;
}

function countOpenNeighbors(grid, x, y) {
  const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  let c = 0;
  for (const [dx,dy] of dirs) {
    const nx = x+dx, ny = y+dy;
    if (ny>=0 && ny<rows && nx>=0 && nx<cols && grid[ny][nx]===0) c++;
  }
  return c;
}

function findOpenNear(tx, ty) {
  for (let r = 0; r < max(cols, rows); r++) {
    for (let y = ty - r; y <= ty + r; y++) {
      for (let x = tx - r; x <= tx + r; x++) {
        if (x >= 1 && y >= 1 && x <= cols-2 && y <= rows-2) {
          if (maze[y][x] === 0) return {x, y};
        }
      }
    }
  }
  return {x: 1, y: 1};
}
</script>
</body>
</html>
