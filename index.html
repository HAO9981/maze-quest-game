<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maze Quest (p5.js) - Sealed Exit Corridor + 3 Gates + 3 Monsters</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <style>
    body { margin:0; background:#0b1020; display:flex; justify-content:center; align-items:center; height:100vh; }
    canvas { border-radius:16px; box-shadow:0 12px 40px rgba(0,0,0,.35); }
  </style>
</head>
<body>
<script>
/* =========================
   HARD MODE (SEALED EXIT CORRIDOR)
   - 3 monsters chase immediately
   - Lose if ANY monster catches you
   - Score: 100 - 1/sec

   Critical Fix (Hardest):
   - Build Exit corridor: [Exit][G1][G2][G3][Tail]
   - Seal the corridor: for every cell in that corridor,
     all side directions are WALL (only corridor forward/back allowed)
   - Exit connects ONLY to G1 (single-route exit)
   => No bypass routes after keys open.

   Fair start:
   - Player spawns at a junction (degree >= 3) AND far from exit corridor
   - Monsters spawn far from player + far from exit corridor
   - Avoid forced-death at start junction (must have an escape branch)

   Movement:
   - Keep diagonal feel (W+D etc.)
   - Keep old collision feel (split-axis tryMove)
========================= */

let state = "START";

// Maze size (odd)
let cols = 31;
let rows = 21;
let cellSize = 26;

let maze; // 0 path, 1 wall

let player;
const MONSTER_COUNT = 3;
let monsters = []; // [{x,y,r,speed,path,cooldown}]

let exitCell;

const KEY_COUNT = 3;
let keys = [];   // {x,y,id,collected}
let gates = [];  // {x,y,id,open}
let keysCollected = 0;

// Time + Score
let startTimeMs = 0;
let timeLimitSec = 160;
let timeLeft = timeLimitSec;
let scoreStart = 100;
let score = scoreStart;

// Maze complexity
const BRAID_PROB = 0.18;
const EXTRA_HOLES = 18;

// Keys placement constraints
const KEY_SAFE_DIST_EXIT = 10;
const KEY_SAFE_DIST_PLAYER = 8;

// Keep spawns away from exit corridor area
const MIN_PLAYER_DIST_FROM_EXIT = 16;   // BFS steps
const MIN_MONSTER_DIST_FROM_EXIT = 16;  // BFS steps

// Fairness knobs (prevents forced-death)
const MIN_MONSTER_DIST = 14;        // monster at least this BFS steps away from player at start
const MIN_ESCAPE_BRANCH_LEN = 12;   // start junction needs at least one long escape branch

function setup() {
  createCanvas(cols * cellSize, rows * cellSize + 80);
  textFont("Arial");
  resetGame();
}

function resetGame() {
  const MAX_TRIES = 420;
  let ok = false;

  for (let attempt = 1; attempt <= MAX_TRIES; attempt++) {
    maze = generateMazePrim(cols, rows);

    // borders
    for (let x=0;x<cols;x++){ maze[0][x]=1; maze[rows-1][x]=1; }
    for (let y=0;y<rows;y++){ maze[y][0]=1; maze[y][cols-1]=1; }

    braidMaze(maze, BRAID_PROB);
    punchExtraHoles(maze, EXTRA_HOLES);

    // Pick an exit cell (near bottom-right but must be open)
    exitCell = findOpenNear(cols-2, rows-2);

    // Force corridor (Exit + 3 gates + tail) and SEAL it
    const forced = forceSealedExitCorridor(exitCell);
    if (!forced) continue;

    // gates must be exactly the 3 corridor cells in front of exit
    gates = forced.gates.map((c,i)=>({x:c.x,y:c.y,id:i+1,open:false}));

    // Place player at a junction far from exit corridor
    const startCell = pickStartJunctionFarFromExit(forced.corridorCells);
    if (!startCell) continue;

    // Place keys far from exit + far from start + not on corridor/gates
    keys = placeMultipleKeys(startCell, exitCell, gates, KEY_COUNT, forced.corridorCells);
    if (!keys) continue;

    // Spawn multiple monsters far from player and far from exit corridor
    const monsterCells = spawnMultipleMonstersFair(startCell, forced.corridorCells, MONSTER_COUNT);
    if (!monsterCells) continue;

    // Commit entities
    player = {
      r: cellSize*0.23,   // ✅你的旧碰撞手感
      x: (startCell.x+0.5)*cellSize,
      y: (startCell.y+0.5)*cellSize,
      speed: 3.1
    };

    monsters = monsterCells.map((mc, i) => ({
      r: cellSize*0.29,
      x: (mc.x+0.5)*cellSize,
      y: (mc.y+0.5)*cellSize,
      speed: 1.65 + i*0.12, // slight variation
      path: [],
      cooldown: floor(random(0, 10))
    }));

    ok = true;
    break;
  }

  if (!ok) {
    // fallback (rare)
    const startCell = {x:1,y:1};
    player = { r: cellSize*0.30, x:(startCell.x+0.5)*cellSize, y:(startCell.y+0.5)*cellSize, speed:3.1 };
    exitCell = {x:cols-2,y:rows-2};
    gates = [{x:cols-3,y:rows-2,id:1,open:false},{x:cols-4,y:rows-2,id:2,open:false},{x:cols-5,y:rows-2,id:3,open:false}];
    keys = [{x:3,y:3,id:1,collected:false},{x:7,y:7,id:2,collected:false},{x:5,y:9,id:3,collected:false}];
    monsters = [
      { r: cellSize*0.29, x:(cols-2+0.5)*cellSize, y:(1+0.5)*cellSize, speed:1.65, path:[], cooldown:0 },
      { r: cellSize*0.29, x:(cols-2+0.5)*cellSize, y:(3+0.5)*cellSize, speed:1.77, path:[], cooldown:0 },
      { r: cellSize*0.29, x:(cols-2+0.5)*cellSize, y:(5+0.5)*cellSize, speed:1.89, path:[], cooldown:0 },
    ];
  }

  keysCollected = 0;
  for (const k of keys) k.collected = false;
  for (const g of gates) g.open = false;

  for (const m of monsters){
    m.path = [];
    m.cooldown = 0;
  }

  timeLeft = timeLimitSec;
  score = scoreStart;
  startTimeMs = millis();
  state = "START";
}

function draw() {
  background(10,16,32);

  drawMaze();
  drawGates();
  drawExit();
  drawKeys();
  drawMonsters();
  drawPlayer();
  drawUI();

  if (state==="START") drawStartScreen();
  if (state==="WIN") drawFinishScreen(true);
  if (state==="LOSE") drawFinishScreen(false);

  if (state==="PLAY") {
    updateTimerAndScore();
    handleMovement();

    updateMonstersChase();
    checkMonsterCatchLose();

    checkPickKeys();
    updateGatesFromKeys();
    checkWin();
  }
}

/* ================= UI ================= */
function drawUI(){
  noStroke();
  fill(255,255,255,10);
  rect(0, rows*cellSize, width, 80);

  const uiY = rows*cellSize + 22;
  fill(240);
  textSize(16);
  textAlign(LEFT,CENTER);
  text(`Time: ${nf(max(0,floor(timeLeft)),3)}s`, 14, uiY);
  text(`Score: ${score}`, 160, uiY);
  text(`Keys: ${keysCollected}/${KEY_COUNT}`, 290, uiY);

  textSize(12);
  fill(255,255,255,210);
  text("Exit corridor is SEALED: no side bypass after keys open.", 14, uiY+26);

  textAlign(RIGHT,CENTER);
  textSize(14);
  fill(240);
  text(`SPACE: Start   R: Restart`, width-14, uiY);
}

function drawStartScreen(){
  noStroke();
  fill(0,0,0,165);
  rect(0,0,width,height);

  fill(255);
  textAlign(CENTER,CENTER);
  textSize(24);
  text("MAZE QUEST - SEALED EXIT CORRIDOR", width/2, height/2-70);

  textSize(14);
  text("3 monsters chase immediately. If ANY catches you: LOSE.", width/2, height/2-30);
  text("Collect 3 keys to break 3 light walls blocking the exit.", width/2, height/2-10);
  text("Press SPACE to start.", width/2, height/2+45);
}

function drawFinishScreen(isWin){
  noStroke();
  fill(0,0,0,175);
  rect(0,0,width,height);

  fill(255);
  textAlign(CENTER,CENTER);
  textSize(26);
  text(isWin ? "YOU ESCAPED ✅" : "GAME OVER ☠️", width/2, height/2-60);

  textSize(14);
  text(`Final Score: ${score}`, width/2, height/2-18);

  textSize(13);
  text("Press R to restart.", width/2, height/2+35);
}

/* ================= Draw ================= */
function drawMaze(){
  for (let y=0;y<rows;y++){
    for (let x=0;x<cols;x++){
      if (maze[y][x]===1){
        fill(40,55,95);
        stroke(255,255,255,18);
        rect(x*cellSize,y*cellSize,cellSize,cellSize,5);
      } else {
        noStroke();
        fill(255,255,255,6);
        rect(x*cellSize,y*cellSize,cellSize,cellSize);
      }
    }
  }
}

function drawExit(){
  const ex=exitCell.x*cellSize, ey=exitCell.y*cellSize;
  noStroke();
  fill(120,210,255,80);
  rect(ex+4,ey+4,cellSize-8,cellSize-8,10);
  fill(120,210,255);
  textSize(11);
  textAlign(CENTER,CENTER);
  text("EXIT", ex+cellSize/2, ey+cellSize/2);
}

function drawGates(){
  for (const g of gates){
    const gx=g.x*cellSize, gy=g.y*cellSize;
    if (g.open){
      noStroke();
      fill(120,210,255,18);
      rect(gx+10, gy+6, cellSize-20, cellSize-12, 8);
      continue;
    }
    noStroke();
    fill(120,210,255,35);
    rect(gx+6, gy+4, cellSize-12, cellSize-8, 10);

    fill(180,245,255,130);
    rect(gx + cellSize*0.45, gy+6, cellSize*0.10, cellSize-12, 6);

    fill(200,255,255);
    textSize(10);
    textAlign(CENTER,CENTER);
    text("G"+g.id, gx+cellSize/2, gy+cellSize*0.20);
  }
}

function drawKeys(){
  for (const k of keys){
    if (k.collected) continue;

    const kx=k.x*cellSize+cellSize/2;
    const ky=k.y*cellSize+cellSize/2;

    let tint;
    if (k.id===1) tint=[255,215,90];
    else if (k.id===2) tint=[255,120,220];
    else tint=[120,255,170];

    noStroke();
    fill(tint[0],tint[1],tint[2],75);
    circle(kx,ky,cellSize*0.90);

    fill(tint[0],tint[1],tint[2]);
    circle(kx-6,ky,12);
    rect(kx-2,ky-3,18,6,3);
    rect(kx+10,ky-3,4,10,2);

    fill(255);
    textSize(10);
    textAlign(CENTER,CENTER);
    text("K"+k.id, kx, ky - cellSize*0.35);
  }
}

function drawPlayer(){
  noStroke();
  fill(255,215,90);
  circle(player.x,player.y,player.r*2);
  fill(30);
  circle(player.x+player.r*0.35, player.y-player.r*0.15, player.r*0.35);
}

function drawMonsters(){
  for (let i=0;i<monsters.length;i++){
    const m = monsters[i];
    noStroke();
    if (i===0) fill(255,90,120);
    else if (i===1) fill(120,180,255);
    else fill(160,255,140);

    circle(m.x,m.y,m.r*2);

    fill(30);
    circle(m.x-m.r*0.25, m.y-m.r*0.1, m.r*0.25);
    circle(m.x+m.r*0.25, m.y-m.r*0.1, m.r*0.25);
  }
}

/* ================= Input ================= */
function keyPressed(){
  if (key==='r' || key==='R'){ resetGame(); return; }
  if (state==="START" && keyCode===32){ state="PLAY"; startTimeMs=millis(); }
}

/* ================= Time/Score ================= */
function elapsedSeconds(){ return (millis()-startTimeMs)/1000.0; }
function updateTimerAndScore(){
  const e=elapsedSeconds();
  timeLeft=timeLimitSec-e;
  score=max(0, scoreStart-floor(e));
  if (timeLeft<=0 || score<=0){ timeLeft=0; score=0; state="LOSE"; }
}

/* ================= Movement/Collision ================= */
function handleMovement(){
  let dx=0, dy=0;
  const sp=player.speed;

  if (keyIsDown(LEFT_ARROW) || keyIsDown(65)) dx -= sp;   // A
  if (keyIsDown(RIGHT_ARROW) || keyIsDown(68)) dx += sp;  // D
  if (keyIsDown(UP_ARROW) || keyIsDown(87)) dy -= sp;     // W
  if (keyIsDown(DOWN_ARROW) || keyIsDown(83)) dy += sp;   // S

  if (dx || dy){
    const mag=Math.hypot(dx,dy);
    dx = dx/mag*sp;
    dy = dy/mag*sp;

    tryMove(player, dx, dy);
  }
}

function tryMove(ent, dx, dy){
  const nx=ent.x+dx, ny=ent.y+dy;
  if (!collides(nx, ent.y, ent.r)) ent.x=nx;
  if (!collides(ent.x, ny, ent.r)) ent.y=ny;
}

function collides(cx,cy,r){
  const minX=floor((cx-r)/cellSize), maxX=floor((cx+r)/cellSize);
  const minY=floor((cy-r)/cellSize), maxY=floor((cy+r)/cellSize);

  for (let y=minY;y<=maxY;y++) for (let x=minX;x<=maxX;x++){
    if (x<0||y<0||x>=cols||y>=rows) return true;

    if (maze[y][x]===1){
      if (circleRectHit(cx,cy,r, x*cellSize,y*cellSize, cellSize,cellSize)) return true;
    }
    const g = gateAtCell(x,y);
    if (g && !g.open){
      if (circleRectHit(cx,cy,r, x*cellSize,y*cellSize, cellSize,cellSize)) return true;
    }
  }
  return false;
}

function circleRectHit(cx,cy,r, rx,ry,rw,rh){
  const px=constrain(cx,rx,rx+rw);
  const py=constrain(cy,ry,ry+rh);
  return ((cx-px)**2 + (cy-py)**2) < r*r;
}

/* ================= Keys/Gates ================= */
function checkPickKeys(){
  const px=floor(player.x/cellSize), py=floor(player.y/cellSize);
  for (const k of keys){
    if (!k.collected && px===k.x && py===k.y){
      k.collected=true;
      keysCollected++;
    }
  }
}

function updateGatesFromKeys(){
  for (const g of gates){
    const k=keys.find(kk=>kk.id===g.id);
    g.open = !!(k && k.collected);
  }
}

function allGatesOpen(){ return gates.every(g=>g.open); }

function checkWin(){
  const px=floor(player.x/cellSize), py=floor(player.y/cellSize);
  if (allGatesOpen() && px===exitCell.x && py===exitCell.y) state="WIN";
}

/* ================= Monsters chase ================= */
function checkMonsterCatchLose(){
  for (const m of monsters){
    if (dist(player.x,player.y,m.x,m.y) < player.r+m.r){
      state="LOSE";
      return;
    }
  }
}

function updateMonstersChase(){
  const playerCell = getCellFromPos(player.x,player.y);

  for (const m of monsters){
    if (m.cooldown>0) m.cooldown--;
    else {
      const mCell = getCellFromPos(m.x,m.y);
      m.path = bfsPath(mCell, playerCell);
      m.cooldown = 8;
    }

    if (m.path && m.path.length>=2){
      const next=m.path[1];
      const tx=(next.x+0.5)*cellSize, ty=(next.y+0.5)*cellSize;
      const vx=tx-m.x, vy=ty-m.y;
      const d=Math.hypot(vx,vy);
      if (d>0.1){
        const step=m.speed;
        tryMove(m, (vx/d)*min(step,d), (vy/d)*min(step,d));
      }
    }
  }
}

/* ================= BFS ================= */
function getCellFromPos(px,py){
  return { x:constrain(floor(px/cellSize),0,cols-1), y:constrain(floor(py/cellSize),0,rows-1) };
}

function gateAtCell(x,y){
  for (const g of gates) if (g.x===x && g.y===y) return g;
  return null;
}

function passable(x,y){
  if (x<0||y<0||x>=cols||y>=rows) return false;
  if (maze[y][x]===1) return false;
  const g=gateAtCell(x,y);
  if (g && !g.open) return false;
  return true;
}

function bfsPath(start, goal){
  if (start.x===goal.x && start.y===goal.y) return [start];

  const q=[start];
  const vis=Array.from({length:rows},()=>Array(cols).fill(false));
  const par=Array.from({length:rows},()=>Array(cols).fill(null));
  vis[start.y][start.x]=true;

  const dirs=[{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}];

  while(q.length){
    const cur=q.shift();
    if (cur.x===goal.x && cur.y===goal.y) break;

    for (const d of dirs){
      const nx=cur.x+d.dx, ny=cur.y+d.dy;
      if (nx<0||ny<0||nx>=cols||ny>=rows) continue;
      if (vis[ny][nx]) continue;
      if (!passable(nx,ny)) continue;

      vis[ny][nx]=true;
      par[ny][nx]=cur;
      q.push({x:nx,y:ny});
    }
  }

  if (!vis[goal.y][goal.x]) return [];
  const path=[];
  let cur=goal;
  while(cur){ path.push(cur); cur=par[cur.y][cur.x]; }
  path.reverse();
  return path;
}

function bfsDistanceNoGates(start, goal){
  if (start.x===goal.x && start.y===goal.y) return 0;
  const q=[start];
  const distArr=Array.from({length:rows},()=>Array(cols).fill(-1));
  distArr[start.y][start.x]=0;

  const dirs=[{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}];

  while(q.length){
    const cur=q.shift();
    const cd=distArr[cur.y][cur.x];
    for(const d of dirs){
      const nx=cur.x+d.dx, ny=cur.y+d.dy;
      if(nx<0||ny<0||nx>=cols||ny>=rows) continue;
      if(distArr[ny][nx]!==-1) continue;
      if(maze[ny][nx]===1) continue;
      distArr[ny][nx]=cd+1;
      if(nx===goal.x && ny===goal.y) return distArr[ny][nx];
      q.push({x:nx,y:ny});
    }
  }
  return -1;
}

function bfsPathNoGates(start, goal){
  if (start.x===goal.x && start.y===goal.y) return [start];
  const q=[start];
  const vis=Array.from({length:rows},()=>Array(cols).fill(false));
  const par=Array.from({length:rows},()=>Array(cols).fill(null));
  vis[start.y][start.x]=true;
  const dirs=[{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}];

  while(q.length){
    const cur=q.shift();
    if(cur.x===goal.x && cur.y===goal.y) break;
    for(const d of dirs){
      const nx=cur.x+d.dx, ny=cur.y+d.dy;
      if(nx<0||ny<0||nx>=cols||ny>=rows) continue;
      if(vis[ny][nx]) continue;
      if(maze[ny][nx]===1) continue;
      vis[ny][nx]=true;
      par[ny][nx]=cur;
      q.push({x:nx,y:ny});
    }
  }
  if(!vis[goal.y][goal.x]) return [];
  const path=[];
  let cur=goal;
  while(cur){ path.push(cur); cur=par[cur.y][cur.x]; }
  path.reverse();
  return path;
}

/* ================= Start fairness helpers ================= */
function degree(cell){
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  let c=0;
  for (const [dx,dy] of dirs){
    const nx=cell.x+dx, ny=cell.y+dy;
    if(nx<0||ny<0||nx>=cols||ny>=rows) continue;
    if(maze[ny][nx]===0) c++;
  }
  return c;
}

function getOpenNeighbors(cell){
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  const list=[];
  for(const [dx,dy] of dirs){
    const nx=cell.x+dx, ny=cell.y+dy;
    if(nx<0||ny<0||nx>=cols||ny>=rows) continue;
    if(maze[ny][nx]===0) list.push({x:nx,y:ny});
  }
  return list;
}

function branchLengthFrom(junction, stepCell){
  const q=[stepCell];
  const distArr=Array.from({length:rows},()=>Array(cols).fill(-1));
  distArr[stepCell.y][stepCell.x]=0;
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  let maxD=0;

  while(q.length){
    const cur=q.shift();
    const cd=distArr[cur.y][cur.x];
    maxD=max(maxD,cd);
    for(const [dx,dy] of dirs){
      const nx=cur.x+dx, ny=cur.y+dy;
      if(nx<0||ny<0||nx>=cols||ny>=rows) continue;
      if(distArr[ny][nx]!==-1) continue;
      if(maze[ny][nx]===1) continue;
      if(nx===junction.x && ny===junction.y) continue;
      distArr[ny][nx]=cd+1;
      q.push({x:nx,y:ny});
    }
  }
  return maxD;
}

function corridorSet(cells){
  const s = new Set();
  for (const c of cells) s.add(`${c.x},${c.y}`);
  return s;
}

function minDistToCorridor(cell, corrCells){
  let best = 9999;
  for (const c of corrCells){
    const d = bfsDistanceNoGates(cell, c);
    if (d !== -1) best = min(best, d);
  }
  return best===9999 ? -1 : best;
}

function pickStartJunctionFarFromExit(corrCells){
  const candidates=[];
  for (let y=1;y<rows-1;y++){
    for (let x=1;x<cols-1;x++){
      if (maze[y][x]!==0) continue;
      const c={x,y};
      if (degree(c) < 3) continue;

      const dCorr = minDistToCorridor(c, corrCells);
      if (dCorr !== -1 && dCorr >= MIN_PLAYER_DIST_FROM_EXIT) candidates.push(c);
    }
  }
  if (!candidates.length) return null;
  return random(candidates);
}

function spawnMultipleMonstersFair(startJ, corrCells, count){
  const candidates = [];
  for (let y=1;y<rows-1;y++){
    for (let x=1;x<cols-1;x++){
      if (maze[y][x]!==0) continue;

      const dPlayer=bfsDistanceNoGates(startJ,{x,y});
      if(dPlayer < MIN_MONSTER_DIST) continue;

      const dCorr = minDistToCorridor({x,y}, corrCells);
      if(dCorr === -1 || dCorr < MIN_MONSTER_DIST_FROM_EXIT) continue;

      candidates.push({x,y});
    }
  }
  if (candidates.length < count) return null;

  const exits = getOpenNeighbors(startJ);
  if (exits.length < 3) return null;

  const picked = [];
  const MIN_BETWEEN_MONSTERS = 10;

  for (let tries=0; tries<1400; tries++){
    const m = random(candidates);

    // apart
    let apart=true;
    for (const p of picked){
      const dd = bfsDistanceNoGates(p, m);
      if (dd !== -1 && dd < MIN_BETWEEN_MONSTERS){ apart=false; break; }
    }
    if (!apart) continue;

    // avoid forced-death at start
    const path = bfsPathNoGates(startJ, m);
    if (!path || path.length < 2) continue;
    const monsterExit = path[1];

    let okEscape=false;
    for (const ex of exits){
      if (ex.x===monsterExit.x && ex.y===monsterExit.y) continue;
      if (branchLengthFrom(startJ, ex) >= MIN_ESCAPE_BRANCH_LEN){
        okEscape=true; break;
      }
    }
    if (!okEscape) continue;

    picked.push(m);
    if (picked.length === count) return picked;
  }
  return null;
}

/* ================= Exit corridor (SEALED) ================= */
function forceSealedExitCorridor(exitC){
  // corridor extends from Exit outward: Exit -> G1 -> G2 -> G3 -> Tail
  const dirs = [
    {dx:-1,dy:0},
    {dx:1,dy:0},
    {dx:0,dy:-1},
    {dx:0,dy:1},
  ];

  // prefer direction already open (less destructive)
  dirs.sort((a,b)=>{
    const na = (maze[exitC.y+a.dy]?.[exitC.x+a.dx]===0) ? 0 : 1;
    const nb = (maze[exitC.y+b.dy]?.[exitC.x+b.dx]===0) ? 0 : 1;
    return na-nb;
  });

  for (const d of dirs){
    const g1 = {x: exitC.x + d.dx*1, y: exitC.y + d.dy*1};
    const g2 = {x: exitC.x + d.dx*2, y: exitC.y + d.dy*2};
    const g3 = {x: exitC.x + d.dx*3, y: exitC.y + d.dy*3};
    const tail = {x: exitC.x + d.dx*4, y: exitC.y + d.dy*4};

    if (!inInnerBounds(g1) || !inInnerBounds(g2) || !inInnerBounds(g3) || !inInnerBounds(tail)) continue;

    // carve corridor cells open
    maze[exitC.y][exitC.x]=0;
    maze[g1.y][g1.x]=0;
    maze[g2.y][g2.x]=0;
    maze[g3.y][g3.x]=0;
    maze[tail.y][tail.x]=0;

    // ensure tail connects to rest of maze via forward direction only
    ensureConnectedForwardOnly(tail, g3, d);

    // HARD SEAL: close side neighbors for each corridor cell
    const corridorCells = [exitC, g1, g2, g3, tail];
    sealCorridorSides(corridorCells, d);

    // Exit has ONLY one neighbor: g1 (we already sealed sides; additionally enforce)
    enforceSingleExitNeighbor(exitC, g1);

    return { gates: [g1,g2,g3], corridorCells };
  }
  return null;
}

function sealCorridorSides(cells, dir){
  // forward/back are allowed: +/- dir
  // side directions are the perpendiculars; must be WALL.
  const side1 = {dx: dir.dy, dy: -dir.dx};
  const side2 = {dx: -dir.dy, dy: dir.dx};

  for (const c of cells){
    const s1 = {x:c.x+side1.dx, y:c.y+side1.dy};
    const s2 = {x:c.x+side2.dx, y:c.y+side2.dy};

    if (inInnerBounds(s1)) maze[s1.y][s1.x] = 1;
    if (inInnerBounds(s2)) maze[s2.y][s2.x] = 1;
  }

  // Also prevent "diagonal leak" around corridor corners:
  // block diagonals adjacent to corridor sides (tight seal).
  for (const c of cells){
    const d1 = {x:c.x+side1.dx+dir.dx, y:c.y+side1.dy+dir.dy};
    const d2 = {x:c.x+side1.dx-dir.dx, y:c.y+side1.dy-dir.dy};
    const d3 = {x:c.x+side2.dx+dir.dx, y:c.y+side2.dy+dir.dy};
    const d4 = {x:c.x+side2.dx-dir.dx, y:c.y+side2.dy-dir.dy};

    if (inInnerBounds(d1)) maze[d1.y][d1.x] = 1;
    if (inInnerBounds(d2)) maze[d2.y][d2.x] = 1;
    if (inInnerBounds(d3)) maze[d3.y][d3.x] = 1;
    if (inInnerBounds(d4)) maze[d4.y][d4.x] = 1;
  }

  // Keep corridor cells open (in case above over-wrote)
  for (const c of cells){
    maze[c.y][c.x] = 0;
  }
}

function enforceSingleExitNeighbor(exitC, gate1){
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  for (const [dx,dy] of dirs){
    const nx=exitC.x+dx, ny=exitC.y+dy;
    if (!inInnerBounds({x:nx,y:ny})) continue;
    if (nx===gate1.x && ny===gate1.y) continue;
    maze[ny][nx]=1;
  }
  maze[exitC.y][exitC.x]=0;
  maze[gate1.y][gate1.x]=0;
}

function ensureConnectedForwardOnly(tail, backCell, dir){
  // We only allow connection forward from tail (same direction as corridor)
  const forward = {x: tail.x + dir.dx, y: tail.y + dir.dy};
  if (inInnerBounds(forward)){
    // open forward cell so the rest of maze can connect there
    maze[forward.y][forward.x] = 0;
  } else {
    // if forward is out, open a random neighbor (fallback)
    ensureConnected(tail, backCell);
  }
}

function inInnerBounds(c){
  return c.x>=1 && c.y>=1 && c.x<=cols-2 && c.y<=rows-2;
}

function ensureConnected(cell, backCell){
  const nbs = [
    {x:cell.x+1,y:cell.y},{x:cell.x-1,y:cell.y},{x:cell.x,y:cell.y+1},{x:cell.x,y:cell.y-1}
  ];
  for (const nb of nbs){
    if (!inInnerBounds(nb)) continue;
    if (nb.x===backCell.x && nb.y===backCell.y) continue;
    if (maze[nb.y][nb.x]===0) return;
  }
  const options = nbs.filter(nb=>inInnerBounds(nb) && !(nb.x===backCell.x && nb.y===backCell.y));
  if (options.length){
    const pick = random(options);
    maze[pick.y][pick.x]=0;
  }
}

/* ================= Keys placement ================= */
function placeMultipleKeys(playerCell, exitCell, gates, count, corridorCells){
  const forbidden = new Set();
  forbidden.add(`${exitCell.x},${exitCell.y}`);
  for (const g of gates) forbidden.add(`${g.x},${g.y}`);
  for (const c of corridorCells) forbidden.add(`${c.x},${c.y}`);

  let candidates=[];
  for (let y=1;y<rows-1;y++){
    for (let x=1;x<cols-1;x++){
      if (maze[y][x]!==0) continue;
      if (forbidden.has(`${x},${y}`)) continue;

      const de=abs(x-exitCell.x)+abs(y-exitCell.y);
      const dp=abs(x-playerCell.x)+abs(y-playerCell.y);
      if (de>=KEY_SAFE_DIST_EXIT && dp>=KEY_SAFE_DIST_PLAYER) candidates.push({x,y});
    }
  }
  if (candidates.length < count) return null;

  const chosen=[];
  for (let tries=0; tries<1400 && chosen.length<count; tries++){
    const c=random(candidates);
    let ok=true;
    for (const s of chosen){
      if (abs(s.x-c.x)+abs(s.y-c.y) < 7) { ok=false; break; }
    }
    if (!ok) continue;
    chosen.push(c);
  }
  if (chosen.length!==count) return null;

  return chosen.map((c,i)=>({x:c.x,y:c.y,id:i+1,collected:false}));
}

/* ================= Helpers ================= */
function findOpenNear(tx,ty){
  for (let r=0;r<max(cols,rows);r++){
    for (let y=ty-r;y<=ty+r;y++){
      for (let x=tx-r;x<=tx+r;x++){
        if(x>=1&&y>=1&&x<=cols-2&&y<=rows-2 && maze[y][x]===0) return {x,y};
      }
    }
  }
  maze[ty][tx]=0;
  return {x:tx,y:ty};
}

/* ================= Maze generation: Randomized Prim ================= */
function generateMazePrim(w,h){
  const g=Array.from({length:h},()=>Array(w).fill(1));
  function inBounds(x,y){ return x>0&&y>0&&x<w-1&&y<h-1; }

  const sx=1, sy=1;
  g[sy][sx]=0;

  const frontier=[];
  function addFrontier(cx,cy){
    const dirs=[{dx:2,dy:0},{dx:-2,dy:0},{dx:0,dy:2},{dx:0,dy:-2}];
    for(const d of dirs){
      const nx=cx+d.dx, ny=cy+d.dy;
      if(!inBounds(nx,ny)) continue;
      if(g[ny][nx]===1){
        frontier.push({to:{x:nx,y:ny}, wall:{x:cx+d.dx/2,y:cy+d.dy/2}});
      }
    }
  }
  addFrontier(sx,sy);

  while(frontier.length){
    const idx=floor(random(frontier.length));
    const f=frontier.splice(idx,1)[0];
    const tx=f.to.x, ty=f.to.y;
    if(g[ty][tx]===0) continue;
    g[f.wall.y][f.wall.x]=0;
    g[ty][tx]=0;
    addFrontier(tx,ty);
  }
  return g;
}

function braidMaze(g, prob){
  const dirs=[{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}];
  for(let y=1;y<rows-1;y++) for(let x=1;x<cols-1;x++){
    if(g[y][x]!==0) continue;
    let openN=0;
    for(const d of dirs) if(g[y+d.dy][x+d.dx]===0) openN++;
    if(openN===1 && random()<prob){
      const walls=[];
      for(const d of dirs){
        const nx=x+d.dx, ny=y+d.dy;
        if(nx<=0||ny<=0||nx>=cols-1||ny>=rows-1) continue;
        if(g[ny][nx]===1) walls.push({x:nx,y:ny});
      }
      if(walls.length){
        const pick=random(walls);
        g[pick.y][pick.x]=0;
      }
    }
  }
}

function punchExtraHoles(g, count){
  let tries = 0;
  const punched = new Set();

  while(count > 0 && tries < 6000){
    tries++;
    const x = floor(random(2, cols-2));
    const y = floor(random(2, rows-2));
    if(g[y][x] !== 1) continue;

    // 不允许扎堆：附近 1 格内如果有刚打过洞就跳过
    let near = false;
    for(let dy=-1; dy<=1; dy++){
      for(let dx=-1; dx<=1; dx++){
        if(dx===0 && dy===0) continue;
        if(punched.has(`${x+dx},${y+dy}`)){ near = true; break; }
      }
      if(near) break;
    }
    if(near) continue;

    // 只允许“墙两侧是路”的墙（像开一扇门），避免挖成大空地
    const left  = g[y][x-1]===0;
    const right = g[y][x+1]===0;
    const up    = g[y-1][x]===0;
    const down  = g[y+1][x]===0;

    const isDoor = (left && right && !up && !down) || (up && down && !left && !right);
    if(!isDoor) continue;

    // 禁止产生 2x2 全空（房间感来源）
    if(wouldCreate2x2Open(g, x, y)) continue;

    g[y][x] = 0;
    punched.add(`${x},${y}`);
    count--;
  }
}

function wouldCreate2x2Open(g, x, y){
  // 检查以 (x,y) 为角的四个 2x2 方块，只要会变成全 0 就拒绝
  const squares = [
    [[x,y],[x+1,y],[x,y+1],[x+1,y+1]],
    [[x,y],[x-1,y],[x,y+1],[x-1,y+1]],
    [[x,y],[x+1,y],[x,y-1],[x+1,y-1]],
    [[x,y],[x-1,y],[x,y-1],[x-1,y-1]],
  ];

  for(const sq of squares){
    let openCount = 0;
    for(const [sx,sy] of sq){
      if(sx<1||sy<1||sx>cols-2||sy>rows-2) { openCount = 0; break; }
      // 注意：我们假设 (x,y) 会被打成 0
      const val = (sx===x && sy===y) ? 0 : g[sy][sx];
      if(val===0) openCount++;
    }
    if(openCount===4) return true;
  }
  return false;
}
